    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One family, three cuts (the "Dojang" direction):
        IBM Plex Sans            body, labels, controls  — the plain family
        IBM Plex Sans Condensed  titles and figures      — the brand family
        IBM Plex Mono            eyebrows, table headers, dates — the data voice
      The first two are also declared in the mat.theme() call in styles.scss; the mono is
      --tcm-font-mono in _tokens.scss. Change one place and you must change the other.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>

  </body>
